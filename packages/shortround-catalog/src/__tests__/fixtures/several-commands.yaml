# Several commands in one line. Near neighbours on purpose: Type and Kind share the word "type" (the
# value decides), a search text command sits beside choose commands, Match any has no step, Drop
# filter's values contain other commands' words ("Tag: react"), and Preview leaves the state, so it
# can't join a line.
version: 2
app: app
pickers:
  sortOption:
    from: app.sortOptions.rows
    empty: No sort options
  facetValue:
    from: app.search.facetValueRows
    empty: No {title} values for this search
  activeFilter:
    from: app.search.activeFilterRows
    empty: No filters to drop
  result:
    from: app.results.rows
    empty: No results loaded
facets:
  content_format: { title: Type, aliases: [format] }
  kinds: { title: Kind, aliases: [category, type] }
  tags: { title: Tag, aliases: [tagged] }
states:
  browsing:
    start: true
    commands:
      search:
        title: Search
        group: Search
        icon: search
        aliases: [find]
        ask: { text: Search for the typed words, required: Type some words first }
        run: app.search.mergeTerms
      matchAny:
        title: Match any
        group: Refine
        icon: settings
        run: app.search.setMatch
        args: [any]
      sort:
        title: Sort
        group: Refine
        icon: settings
        aliases: [sort by]
        ask: { choose: sortOption }
        run: app.search.setSort
      facet:
        forEach: facets
        group: Refine
        icon: folder
        ask: { choose: facetValue }
        run: app.search.addFacetValue
      drop:
        title: Drop filter
        group: Refine
        icon: settings
        aliases: [drop]
        ask: { choose: activeFilter }
        run: app.search.dropFilter
      preview:
        title: Preview
        group: Results
        icon: file
        ask: { choose: result }
        run: app.results.preview
        then: previewing
  previewing:
    panel: sidecar
    commands:
      closePreview:
        title: Close preview
        group: Preview
        run: app.results.closePreview
        then: browsing
