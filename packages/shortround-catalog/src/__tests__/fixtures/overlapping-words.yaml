# Two commands whose words overlap: "open" is the start of "open in service". "open" takes free text, so
# only the longest-match rule keeps it from also claiming "open in service …".
version: 2
app: app
pickers:
  result:
    from: app.results.rows
    empty: No results loaded
states:
  browsing:
    start: true
    commands:
      open:
        title: Open
        ask: { text: Open the typed address }
        run: app.results.openAddress
      openInService:
        title: Open in service
        ask: { choose: result }
        run: app.results.openInService
