version: 2
app: app
pickers:
  sortOption:
    from: app.sortOptions.rows
    empty: No sort options
  facetValue:
    from: app.search.facetValueRows
    empty: No {title} values for this search
  result:
    from: app.results.rows
    empty: No results loaded
facets:
  tags: { title: Tag, aliases: [tagged] }
  bookmarked_at: { title: Bookmark age }
states:
  browsing:
    start: true
    commands:
      search:
        title: Search
        group: Search
        icon: search
        aliases: [find]
        ask: { text: Search for the typed words, required: Type some words first }
        run: app.search.mergeTerms
      matchAny:
        title: Match any
        group: Refine
        icon: settings
        run: app.search.setMatch
        args: [any]
      sort:
        title: Sort
        group: Refine
        icon: settings
        ask: { choose: sortOption }
        run: app.search.setSort
      facet:
        forEach: facets
        group: Refine
        icon: folder
        ask: { choose: facetValue }
        run: app.search.addFacetValue
      preview:
        title: Preview
        group: Results
        icon: file
        ask: { choose: result }
        run: app.results.preview
        then: previewing
  previewing:
    panel: sidecar
    commands:
      next:
        title: Next
        group: Preview
        run: app.results.next
      openInService:
        title: Open in service
        group: Preview
        when: app.results.previewedHasServiceLink
        run: app.results.openInService
      closePreview:
        title: Close preview
        group: Preview
        run: app.results.closePreview
        then: browsing
